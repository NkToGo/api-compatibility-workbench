name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Java domain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify curated case inputs
        shell: pwsh
        run: ./scripts/Verify-CuratedCase.ps1
      - name: Prepare pinned historical SDKs
        shell: pwsh
        run: ./scripts/Prepare-StripeCase.ps1
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./mvnw.cmd -B -ntp -f backend/pom.xml clean verify
      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: sh ./mvnw -B -ntp -f backend/pom.xml clean verify
      - name: Retain case reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stripe-case-reports-${{ matrix.os }}
          path: |
            backend/target/test-case-runs/**/report.json
            backend/target/test-case-runs/**/report.html
          if-no-files-found: warn
          retention-days: 14
