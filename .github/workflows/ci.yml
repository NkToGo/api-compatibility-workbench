name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Java domain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify curated case inputs
        shell: pwsh
        run: ./scripts/Verify-CuratedCase.ps1
      - name: Prepare pinned historical SDKs
        shell: pwsh
        run: ./scripts/Prepare-StripeCase.ps1
      - name: Prepare pinned invoice consumer builds
        shell: pwsh
        run: ./scripts/Prepare-InvoiceConsumers.ps1
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./mvnw.cmd -B -ntp -f backend/pom.xml clean verify
      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: sh ./mvnw -B -ntp -f backend/pom.xml clean verify
      - name: Verify versioned invoice Maven projects
        shell: pwsh
        run: |
          foreach ($invoiceTrain in @('acacia', 'basil')) {
            $invoiceBuildArguments = @('-B', '-ntp', '-f', 'cases/stripe-invoice-subscription-2025-03-31/consumer-sources-v1/pom.xml', 'clean', 'package')
            if ($invoiceTrain -eq 'basil') { $invoiceBuildArguments += @('-P', 'basil') }
            if ($IsWindows) { & ./mvnw.cmd @invoiceBuildArguments } else { & sh ./mvnw @invoiceBuildArguments }
            if ($LASTEXITCODE -ne 0) { throw 'Invoice Maven project build failed.' }
          }
      - name: Verify frozen campaign registration
        shell: pwsh
        run: ./scripts/Test-CoordinationCampaign.ps1
      - name: Verify ordered campaign execution
        shell: pwsh
        run: ./scripts/Test-CoordinationCampaignExecution.ps1
      - name: Verify coordination review input binding
        shell: pwsh
        run: ./scripts/Test-CoordinationReviewPacket.ps1
      - name: Verify coordination semantic review binding and gates
        shell: pwsh
        run: ./scripts/Test-CoordinationSemanticReview.ps1
      - name: Verify bound reviewed-record export and recovery
        shell: pwsh
        run: ./scripts/Test-CoordinationReviewedRecords.ps1
      - name: Verify scoped routing and evidence limits
        shell: pwsh
        run: ./scripts/Test-CoordinationRoute.ps1
      - name: Build immutable case worker
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/Build-IsolatedWorker.ps1
      - name: Verify real container boundaries
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $workerImage = (Get-Content -LiteralPath backend/target/worker-image.txt -Raw).Trim()
          if ($workerImage -cnotmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing worker image identity.' }
          sh ./mvnw -B -ntp -f backend/pom.xml "-Dworkbench.container.image=$workerImage" '-Dtest=DockerCaseExecutorTest,DurableExecutionContainerTest,InvestigationToolsContainerTest' test
          if ($LASTEXITCODE -ne 0) { throw 'Container verification failed.' }
      - name: Build isolated repair worker
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/Build-IsolatedWorker.ps1 -RepairWorker
      - name: Verify protected repair execution
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $repairImage = (Get-Content -LiteralPath backend/target/repair-worker-image.txt -Raw).Trim()
          if ($repairImage -cnotmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing repair image identity.' }
          sh ./mvnw -B -ntp -f backend/pom.xml "-Dworkbench.repair.image=$repairImage" '-Dtest=RepairSandboxContainerTest,SubscriptionSandboxContainerTest' test
          if ($LASTEXITCODE -ne 0) { throw 'Protected repair verification failed.' }
      - name: Retain case reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stripe-case-reports-${{ matrix.os }}
          path: |
            backend/target/test-case-runs/**/report.json
            backend/target/test-case-runs/**/report.html
            backend/target/subscription-period-case-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain isolated execution receipts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: isolated-case-receipts
          path: |
            backend/target/isolated-test-runs/
            backend/target/test-evidence-store/
            backend/target/durable-test-runs/
            backend/target/investigation-test-runs/
            backend/target/repair-container-tests/
            backend/target/subscription-container-tests/
          if-no-files-found: warn
          retention-days: 14
